<style>
@font-face{font-family:'BarlowC';font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'BarlowC';font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'BarlowC';font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'BarlowC';font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
:root{
  --acc:#ff9b3d;--acc2:#ffd08a;--cool:#86d6ff;--ok:#4dffa0;--warn:#ffcc4d;--bad:#ff5149;
  --glass:rgba(10,13,19,.56);--glass2:rgba(16,20,28,.78);--line:rgba(255,255,255,.12);--txt:#eef2f6;--dim:rgba(222,230,240,.62);
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
  --disp:'BarlowC','Barlow',system-ui,sans-serif;--body:'Barlow',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#05070b;color:var(--txt);font-family:var(--body);overscroll-behavior:none;position:fixed;inset:0;touch-action:none;-webkit-text-size-adjust:100%}
canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
svg{display:block}
#touch{position:fixed;inset:0;z-index:4;touch-action:none;display:none}
body[data-screen="flight"] #touch{display:block}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;opacity:0;transition:opacity .4s ease,transform .45s cubic-bezier(.2,.8,.2,1);transform:translateY(10px);
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px)}
.screen.on{opacity:1;pointer-events:auto;transform:none}
.screen.out{opacity:0;pointer-events:none;transform:translateY(-6px)}
.screen.modal{background:rgba(3,5,8,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);justify-content:center;align-items:center}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.glass-s{background:rgba(8,11,16,.42);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:16px;font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .12s ease,background .2s;color:var(--txt)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,#ffb466,#ff8a2a);color:#1a0d02;border-color:rgba(255,220,180,.6);box-shadow:0 10px 30px rgba(255,140,40,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.big{min-height:60px;font-size:23px}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;font-size:15px;padding:0 14px;border-radius:12px}
.btn.danger{color:#ffb0a8;border-color:rgba(255,90,80,.4)}
.btn.icon-only{width:60px;padding:0}.btn.icon-only svg{width:24px;height:24px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(8,11,16,.42);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.icon-btn svg{width:22px;height:22px}
.link{color:var(--dim);font-size:14px;text-decoration:underline;text-underline-offset:3px;margin-top:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stars-inline{display:inline-flex;align-items:center;gap:5px;font-family:var(--disp);font-weight:700;font-size:18px;color:var(--dim)}
.stars-inline svg{width:18px;height:18px;fill:var(--acc)}.stars-inline b{color:var(--txt)}
/* Boot */
#boot{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 80% at 50% 110%,#2a1606 0%,#05070b 60%);display:grid;place-items:center;transition:opacity .7s ease}
#boot.off{opacity:0;pointer-events:none}
#boot .b{display:flex;flex-direction:column;align-items:center;gap:18px}
#boot .bar{width:140px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#boot .bar i{display:block;height:100%;width:40%;background:var(--acc);animation:bootbar 1.1s ease-in-out infinite}
@keyframes bootbar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
/* Logo */
.logo{position:relative;font-family:var(--disp);font-weight:800;font-size:clamp(58px,19vw,92px);line-height:.9;letter-spacing:.02em;transform:skewX(-8deg);display:inline-flex;
  filter:drop-shadow(0 6px 30px rgba(0,0,0,.55))}
.logo .lg-c{background:linear-gradient(180deg,#fff 0%,#d7dde4 48%,#8c949e 52%,#e7ebef 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .lg-s{background:linear-gradient(180deg,#ffe0b0 0%,#ffae55 48%,#d86b12 52%,#ffbf70 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .stick{position:absolute;top:-16px;height:6px;width:46%;border-radius:3px;background:linear-gradient(90deg,#6d747c,#e9edf1 50%,#6d747c)}
.logo .s1{left:2%;transform:rotate(9deg);transform-origin:left}.logo .s2{right:2%;transform:rotate(-9deg);transform-origin:right}
.logo-wrap{display:flex;flex-direction:column;align-items:center;margin-top:7vh;gap:10px;text-align:center}
.tagline{font-family:var(--disp);font-weight:600;letter-spacing:.32em;text-transform:uppercase;font-size:14px;color:var(--acc2);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.title-menu{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.title-stats{display:flex;justify-content:center;gap:18px;font-size:14px;color:var(--dim);margin-top:4px;text-shadow:0 1px 6px #000}
.title-foot{text-align:center;font-size:11px;color:rgba(230,235,245,.5);margin-top:10px;letter-spacing:.04em}
.screen.title{background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 55%,rgba(0,0,0,.7) 100%)}
/* Kopfzeile */
.bar{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:10px}
.bar h2{flex:1;margin:0;font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.05em;text-transform:uppercase}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;margin:0 -16px;padding:0 16px 20px;mask-image:linear-gradient(180deg,transparent 0,#000 12px,#000 calc(100% - 20px),transparent)}
.screen.missions,.screen.achs,.screen.settings,.screen.brief{background:linear-gradient(180deg,rgba(4,6,10,.82),rgba(4,6,10,.5) 40%,rgba(4,6,10,.85))}
/* Missionen */
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 14px 14px 12px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;overflow:hidden;transition:transform .12s}
.mcard:active{transform:scale(.98)}
.mcard::before{content:'';position:absolute;inset:0;opacity:.35;pointer-events:none}
.mcard.tod-day::before,.mcard.tod-afternoon::before{background:linear-gradient(90deg,rgba(90,160,255,.35),transparent 60%)}
.mcard.tod-dusk::before{background:linear-gradient(90deg,rgba(255,120,50,.45),transparent 60%)}
.mcard.tod-night::before{background:linear-gradient(90deg,rgba(60,70,160,.45),transparent 60%)}
.mcard.tod-dawn::before{background:linear-gradient(90deg,rgba(220,220,230,.3),transparent 60%)}
.mcard.tod-storm::before{background:linear-gradient(90deg,rgba(130,140,150,.4),transparent 60%)}
.mc-num{font-family:var(--disp);font-weight:800;font-size:34px;color:rgba(255,255,255,.85);width:44px;text-align:center;position:relative}
.mc-body{flex:1;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.mc-body b{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.03em}
.mc-body small{color:var(--dim);font-size:13px}
.mc-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.mc-meta .tod,.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.08);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.mc-meta svg{width:13px;height:13px}
.tag{background:rgba(255,155,61,.18);color:var(--acc2)}
.mc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;position:relative}
.mc-right small{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.mc-stars{display:flex;gap:2px}.mc-stars i svg{width:19px;height:19px;fill:rgba(255,255,255,.16)}.mc-stars i.on svg{fill:var(--acc);filter:drop-shadow(0 0 6px rgba(255,150,50,.6))}
.mcard.locked{opacity:.55}.mc-lock{display:flex;flex-direction:column;align-items:flex-end;gap:3px}.mc-lock svg{width:20px;height:20px}.mc-lock small{max-width:90px;text-align:right}
/* Briefing */
.brief-card{padding:22px 20px}
.kicker{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc2)}
.brief-card h1{font-family:var(--disp);font-weight:800;font-size:44px;line-height:1;margin:8px 0 12px;letter-spacing:.01em}
.brief-card p{font-size:16px;line-height:1.5;color:rgba(235,240,246,.86);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.chip svg{width:15px;height:15px}.chip b{font-weight:600;color:var(--dim)}.chip.warn{border-color:rgba(255,200,80,.35);color:var(--warn)}
.best{font-size:14px;color:var(--dim);margin-bottom:14px}.best b{color:var(--txt)}
.label{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:6px 0 8px}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;gap:4px;border:1px solid rgba(255,255,255,.08)}
.seg button{flex:1;min-height:40px;border-radius:10px;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);transition:background .2s,color .2s}
.seg button.on{background:rgba(255,255,255,.14);color:var(--txt);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.assist-desc{display:block;color:var(--dim);font-size:13px;margin-top:8px;line-height:1.4}
.foot{display:flex;gap:10px;padding-top:10px}.foot .primary{flex:1.6}.foot .ghost{flex:1}
/* Tutorial */
.screen.tutorial{justify-content:flex-end;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.75))}
.tut{padding:22px 20px 18px;position:relative}
.tslide{display:none;flex-direction:column;align-items:center;text-align:center}.tslide.on{display:flex;animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tslide h2{font-family:var(--disp);font-weight:800;font-size:30px;margin:14px 0 6px;letter-spacing:.03em;text-transform:uppercase}
.tslide p{margin:0 0 6px;font-size:15.5px;line-height:1.5;color:rgba(235,240,246,.86)}
.ill{width:100%;height:150px;border-radius:16px;background:rgba(0,0,0,.3);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.ill i,.ill b{position:absolute;display:block}
.ill-stick i{left:50%;top:50%;width:96px;height:96px;margin:-48px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.ill-stick b{left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,255,255,.85);animation:stk 2.2s ease-in-out infinite}
@keyframes stk{0%,100%{transform:translateX(-34px)}50%{transform:translateX(34px)}}
.ill-thr i{left:50%;top:14px;bottom:14px;width:46px;margin-left:-23px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:linear-gradient(0deg,rgba(255,155,61,.6),transparent)}
.ill-thr b{left:50%;width:58px;height:22px;margin-left:-29px;border-radius:8px;background:#fff;animation:thr 2.4s ease-in-out infinite}
@keyframes thr{0%,100%{top:110px}50%{top:24px}}
.ill-win i{left:20%;right:20%;top:58%;height:8px;border-radius:4px;background:linear-gradient(90deg,#9aa3ad 0 30%,transparent 30% 70%,#9aa3ad 70%)}
.ill-win b{left:50%;width:34px;height:110px;margin-left:-17px;top:-10px;border-radius:12px 12px 4px 4px;background:linear-gradient(90deg,#8d949c,#e6eaee,#8d949c);animation:win 2.6s ease-in-out infinite}
@keyframes win{0%{transform:translate(-40px,-40px)}60%,100%{transform:translate(0,0)}}
.ill-arms i{left:12%;width:34%;top:56%;height:10px;border-radius:5px;background:#aab2bb;animation:arml 2.4s ease-in-out infinite;transform-origin:left}
.ill-arms b{right:12%;width:34%;top:56%;height:10px;border-radius:5px;background:#aab2bb;animation:armr 2.4s ease-in-out infinite;transform-origin:right}
@keyframes arml{0%,30%{transform:rotate(-24deg)}60%,100%{transform:rotate(0)}}@keyframes armr{0%,30%{transform:rotate(24deg)}60%,100%{transform:rotate(0)}}
.dots{display:flex;justify-content:center;gap:6px;margin:14px 0}.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.25);transition:width .3s}.dots i.on{width:22px;background:var(--acc)}
/* Pause */
.pause-card{width:min(92vw,360px);padding:24px 20px;display:flex;flex-direction:column;gap:10px;text-align:center}
.pause-card h2{margin:0;font-family:var(--disp);font-weight:800;font-size:36px;letter-spacing:.08em;text-transform:uppercase}
.pause-card small{color:var(--dim);margin-bottom:8px}
/* Ergebnis */
.screen.result-screen{justify-content:flex-end;background:linear-gradient(180deg,rgba(0,0,0,0) 20%,rgba(0,0,0,.72))}
.res{max-height:100%;overflow-y:auto;touch-action:pan-y;padding:18px 16px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;animation:resin .6s cubic-bezier(.2,.9,.2,1)}
@keyframes resin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grade{font-family:var(--disp);font-weight:800;font-size:52px;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin-top:6px}
.res.g0 .grade{background:linear-gradient(180deg,#fff3d6,#ffb050);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,160,60,.45))}
.res.g1 .grade{color:#eaf6ff}.res.g2 .grade{color:#ffd9a0}.res.fail .grade{color:var(--bad);font-size:46px}
.res .sub{color:var(--dim);font-size:15px;margin:4px 0 8px}
.res-stars{display:flex;gap:6px;margin:6px 0}.res-stars i svg{width:36px;height:36px;fill:rgba(255,255,255,.14)}
.res-stars i.on svg{fill:var(--acc);animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d);filter:drop-shadow(0 0 12px rgba(255,150,50,.7))}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg);fill:rgba(255,255,255,.14)}100%{transform:none}}
.medal{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.12em;padding:4px 14px;border-radius:20px;margin:2px 0 6px}
.medal.gold{background:linear-gradient(180deg,#ffe9a0,#d8a227);color:#3a2400}.medal.silver{background:linear-gradient(180deg,#f4f6f8,#a9b1ba);color:#222}.medal.bronze{background:linear-gradient(180deg,#f1c49a,#a8652e);color:#2a1204}
.rows{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.rows .r{display:flex;justify-content:space-between;align-items:baseline;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;color:var(--dim)}
.rows .r b{color:var(--txt);font-family:var(--disp);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.rows .r.q0 b{color:var(--ok)}.rows .r.q1 b{color:#c9f27a}.rows .r.q2 b{color:var(--warn)}.rows .r.q3 b{color:var(--bad)}
.res.fail .rows{grid-template-columns:1fr}
.score{display:flex;flex-direction:column;align-items:center;margin:4px 0 6px}.score small{color:var(--dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.score b{font-family:var(--disp);font-weight:800;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums}.score em{font-style:normal;color:var(--acc2);font-weight:700;font-size:14px}
.unls{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%;margin:2px 0 8px}
